<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threads 洞察擷取器</title><style>
body{margin:0;width:360px;background:#fbfaf7;color:#25313c;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{padding:18px}.tag{display:inline-block;border-radius:999px;background:#e9f4ef;color:#26705d;padding:5px 9px;font-size:11px;font-weight:800}h1{font-size:18px;margin:12px 0 5px}.hint{font-size:12px;line-height:1.7;color:#6a7480}.box{margin-top:14px;border:1px solid #e7e5df;background:white;border-radius:15px;padding:13px}.btn{width:100%;height:42px;border:0;border-radius:12px;background:#2f8271;color:white;font-weight:800;cursor:pointer}.btn.secondary{margin-top:8px;background:#eef5f2;color:#26705d;border:1px solid #d6e8e1}.btn.ghost{margin-top:8px;background:#fff;color:#59646f;border:1px solid #e7e5df}.btn:disabled{opacity:.45}.small{font-size:11px;line-height:1.6;color:#7a828c;margin-top:9px}.status{margin-top:12px;font-size:12px;line-height:1.6;font-weight:700}.ok{color:#26705d}.err{color:#b65348}.steps{margin-top:12px;border-radius:12px;background:#f7f5ef;padding:10px;font-size:11px;line-height:1.7;color:#68727c}.count{margin:10px 0 0;font-size:11px;font-weight:800;color:#26705d}
</style></head><body><div class="wrap"><span class="tag">逐篇洞察・免複製</span><h1>Threads 洞察擷取器 v1.2</h1><p class="hint">單篇洞察會抓「瀏覽、瀏覽人數、追蹤、互動率、流量來源」並累積。你可以開下一篇繼續抓，最後一次送進 Dashboard。</p><div class="steps"><b>① Threads：</b>打開某篇「洞察」→ 按①；換下一篇可重複。<br><b>② Dashboard：</b>全部抓完後切回資料中心 → 按②。</div><div class="box"><button id="capture" class="btn">① 擷取／累積目前貼文洞察</button><p id="count" class="count">目前已累積 0 篇</p><button id="send" class="btn secondary">② 全部送入目前 Dashboard</button><button id="download" class="btn ghost">另存 JSON 備份</button><button id="clear" class="btn ghost">清空已累積資料</button><div id="status" class="status"></div><p class="small">若在洞察總覽按①，會先抓畫面可辨識的內容；進入單篇洞察再按①會補齊該篇的詳細數字。重複抓同一篇會更新，不會新增分身。</p></div></div><script src="popup.js"></script></body></html>
